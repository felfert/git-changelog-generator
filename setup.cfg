[bdist_rpm]
requires: python-semver>=2.0.1, python-jinja2>=2.8, GitPython>=1.0.1

[sdist_dsc]
with-python2 = True
with-python3 = True
no-python2-scripts = True

[debianize]
with-python2 = True
with-python3 = True
no-python2-scripts = True

[aliases]
test=pytest

[tool:pytest]
addopts = --cov=gcg --cov-report=xml --log-level=DEBUG --pylint --pep8
python_files = tests/*.py
markers = pep8

[coverage:run]
omit = gcg/templates/*
branch = True
