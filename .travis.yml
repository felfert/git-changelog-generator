language: python
sudo: required
dist: xenial
python: 3.5
virtualenv:
  system_site_packages: true
before_install:
- sudo apt-get -qq update
- |
  sudo apt-get install -y \
      "rpm=4.12.*" "fakeroot=1.20.2-*" "jq=1.5+*" python-all python3-all python-setuptools python3-setuptools "debhelper=9.*"
- curl -L "http://download.opensuse.org/repositories/home:/felfert/xUbuntu_16.04/Release.key"
  | sudo apt-key add
- echo "deb http://download.opensuse.org/repositories/home:/felfert/xUbuntu_16.04 ./"
  | sudo tee /etc/apt/sources.list.d/felfert.list ;
- sudo apt-get update -q
- sudo apt-get install -y python-rpm-macros
install:
- pip install -r requirements_setup.txt -r requirements_test.txt
script:
- export VERSION=${TRAVIS_TAG:-$(<version.txt).dev${TRAVIS_BUILD_NUMBER}}
- python setup.py test build sdist bdist_wheel bdist
- ls -al dist/
- python setup.py --command-packages=stdeb.command sdist_dsc --with-python2=True --with-python3=True
  --no-python2-scripts=True bdist_deb
- rpmbuild -ba gcg.spec  --define "_topdir ${PWD}/dist" --define "_sourcedir ${PWD}/dist"
  --define "version ${VERSION}"
- rpm -qlpi --requires --verbose dist/RPMS/*/*.rpm dist/SRPMS/*.rpm
- for i in deb_dist/*.deb; do dpkg --info "$i" && dpkg -c "$i"; done
before_deploy:
- ls -al; pwd; find dist deb_dist -ls
- |
  if [[ -n "$TRAVIS_TAG" ]] && [[ "${TRAVIS_TAG}" != "$(<version.txt)" ]]; then
      >&2 echo "ERROR: You have marked a release by applying a Git tag and your version.txt doesn't match it"
      >&2 echo "Tip: Don't tag if you want to deploy only to test.pypi.org"
      false
  fi
deploy:
  provider: releases
  api_key:
    secure: 
  file: dist/*.rpm deb_dist/*.deb
  on:
    repo: felfert/git-changelog-generator
    branch: python3
